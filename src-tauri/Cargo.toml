[package]
name = "module"
version = "2.2.0"
description = "Module - 个人任务管理系统"
authors = ["Module Team"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "fast-rng", "serde"] }
dirs = "7.0.0"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
rust_xlsxwriter = "0.104.0"
reqwest = { version = "0.13.5", features = ["json"] }

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3.6", features = ["apple-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
